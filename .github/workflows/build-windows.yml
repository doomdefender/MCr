name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller
      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MetaDataCleaner --icon MCr.ico --add-data "MCr.ico;." --add-data "MCr_logo.png;." metadata_cleaner.py
      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist/MetaDataCleaner.exe")) {
            Write-Error "No se generó dist/MetaDataCleaner.exe"
          }
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaDataCleaner-Windows
          path: dist/MetaDataCleaner.exe
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.5.8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.8
          name: MetaDataCleaner v0.5.8
          body: |
            ## MetaDataCleaner v0.5.8

            Portable Windows application for offline image metadata sanitization and normalization.

            ### Included
            - Windows portable EXE
            - Offline/local processing
            - Supports JPG/JPEG, PNG and WebP
            - Originals are left untouched
            - Cleaned copies are saved with the _CLEAN suffix

            This release is intended for privacy-oriented metadata cleaning and image normalization. It does not guarantee any outcome against external detection or classification systems.
          files: dist/MetaDataCleaner.exe
          fail_on_unmatched_files: true
